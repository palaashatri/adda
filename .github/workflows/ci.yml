name: JITScope CI

on:
  push:
    branches: [main]
    paths: ['vibes/jitscope/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['vibes/jitscope/**', '.github/workflows/ci.yml']

jobs:
  verify:
    name: mvn clean verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }} (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build & verify (0 skipped tests)
        working-directory: vibes/jitscope
        run: mvn clean verify --no-transfer-progress
